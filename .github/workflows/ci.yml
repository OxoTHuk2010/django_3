name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality Gate
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myshop
          POSTGRES_USER: myshop_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myshop_ci -d myshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      DEBUG: "1"
      DB_NAME: myshop
      DB_USER: myshop_ci
      DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev --no-root

      - name: Django check
        run: poetry run python manage.py check

      - name: Migration check
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Ruff
        run: poetry run ruff check . --no-cache

      - name: Mypy
        run: poetry run mypy src

      - name: Tests
        run: poetry run pytest -q -p no:cacheprovider --cov --cov-report=term-missing

      - name: Docker build
        run: docker build -t myshop-web:ci .

      - name: Production Docker build
        run: docker build -f Dockerfile.production -t myshop-web:production-ci .
