<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyShop{% endblock %}</title>
    <style>
        :root {
            --bg: #f7f3ea;
            --ink: #1d1a16;
            --muted: #756f64;
            --line: #ded3bf;
            --card: #fffaf1;
            --accent: #b84b2f;
            --accent-dark: #7d2f20;
            --green: #32664d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(184, 75, 47, 0.18), transparent 30rem),
                radial-gradient(circle at 90% 5%, rgba(50, 102, 77, 0.16), transparent 28rem),
                linear-gradient(135deg, #fbf6eb 0%, var(--bg) 42%, #efe3cf 100%);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid rgba(29, 26, 22, 0.08);
            backdrop-filter: blur(16px);
            background: rgba(247, 243, 234, 0.82);
        }

        .site-nav {
            display: flex;
            min-height: 72px;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.06em;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            color: var(--muted);
            font-size: 15px;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
            gap: 32px;
            align-items: stretch;
            padding: 54px 0 36px;
        }

        .hero-panel,
        .surface {
            border: 1px solid var(--line);
            border-radius: 32px;
            background: rgba(255, 250, 241, 0.82);
            box-shadow: 0 24px 70px rgba(94, 65, 38, 0.12);
        }

        .hero-panel {
            padding: 44px;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: var(--accent-dark);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 820px;
            margin: 0;
            font-size: clamp(42px, 7vw, 88px);
            line-height: 0.91;
            letter-spacing: -0.075em;
        }

        .lead {
            max-width: 680px;
            margin: 22px 0 0;
            color: var(--muted);
            font-size: 19px;
            line-height: 1.55;
        }

        .button,
        button {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border: 1px solid var(--accent-dark);
            border-radius: 999px;
            color: #fffaf1;
            font: inherit;
            font-weight: 700;
            background: var(--accent);
            cursor: pointer;
        }

        .button.secondary {
            color: var(--accent-dark);
            background: transparent;
        }

        .section {
            padding: 30px 0 56px;
        }

        .section-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: clamp(30px, 4vw, 54px);
            line-height: 1;
            letter-spacing: -0.055em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .product-card {
            display: flex;
            min-height: 280px;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--card);
        }

        .product-card__category {
            color: var(--green);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .product-card h3 {
            margin: 18px 0 10px;
            font-size: 26px;
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        .product-card p {
            color: var(--muted);
            line-height: 1.45;
        }

        .product-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 20px;
        }

        .price {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .stock {
            color: var(--green);
            font-size: 14px;
            font-weight: 700;
        }

        .empty-state {
            padding: 42px;
            border: 1px dashed var(--line);
            border-radius: 28px;
            color: var(--muted);
            background: rgba(255, 250, 241, 0.7);
        }

        .filters {
            display: grid;
            grid-template-columns: 1.5fr 1fr 0.8fr 0.8fr 1fr auto;
            gap: 12px;
            padding: 18px;
            margin-bottom: 22px;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: rgba(255, 250, 241, 0.8);
        }

        input,
        select {
            width: 100%;
            min-height: 46px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 16px;
            color: var(--ink);
            font: inherit;
            background: #fffdf7;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
        }

        .page-link {
            min-width: 42px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--card);
            text-align: center;
        }

        .page-link.active {
            color: #fffaf1;
            border-color: var(--accent);
            background: var(--accent);
        }

        button:disabled {
            opacity: 0.58;
            cursor: not-allowed;
        }

        .product-detail__layout {
            display: grid;
            grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr);
            gap: 24px;
            align-items: stretch;
        }

        .product-detail__media,
        .product-detail__summary {
            padding: 28px;
        }

        .product-detail__image {
            width: 100%;
            height: min(520px, 60vw);
            object-fit: cover;
            border-radius: 24px;
        }

        .product-detail__no-image {
            display: grid;
            min-height: 360px;
            place-items: center;
            border: 1px dashed var(--line);
            border-radius: 24px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.35);
        }

        .product-detail__facts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin: 28px 0;
        }

        .product-detail__facts > div,
        .product-detail__buy,
        .product-detail__rating {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: rgba(255, 253, 247, 0.72);
        }

        .product-detail__label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .product-detail__buy p {
            margin: 12px 0 0;
            color: var(--muted);
        }

        .reviews-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .review-card {
            padding: 22px;
        }

        .review-card__header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            color: var(--green);
        }

        @media (max-width: 900px) {
            .hero,
            .grid,
            .reviews-list,
            .product-detail__layout,
            .product-detail__facts,
            .filters {
                grid-template-columns: 1fr;
            }

            .hero-panel {
                padding: 28px;
            }

            .site-nav,
            .section-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav class="page site-nav" aria-label="Основная навигация">
            <a class="brand" href="{% url 'catalog:home' %}">MyShop</a>
            <div class="nav-links">
                <a href="{% url 'catalog:product_list' %}">Каталог</a>
                <span>Корзина позже</span>
                <span>Кабинет позже</span>
            </div>
        </nav>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
